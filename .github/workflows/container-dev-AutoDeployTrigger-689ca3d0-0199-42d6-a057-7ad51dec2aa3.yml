name: Trigger auto deployment for container-dev

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ dev ]
    paths:
    - '**'
    - '.github/workflows/container-dev-AutoDeployTrigger-689ca3d0-0199-42d6-a057-7ad51dec2aa3.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.CONTAINERDEV_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ghcr.io
          registryUsername: ${{ secrets.CONTAINERDEV_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CONTAINERDEV_REGISTRY_PASSWORD }}
          containerAppName: container-dev
          resourceGroup: ContainerDev
          imageToBuild: ghcr.io/container-dev:${{ github.sha }}
          
            

     

